# frontend/nginx.conf
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routing — any path nginx doesn't recognize
    # as a real file falls back to index.html so the app's own router
    # handles it (e.g. a hard refresh on /room/AB12CD wouldn't otherwise
    # resolve to anything on the server).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite's build output hashes filenames (e.g. index-a1b2c3.js), so
    # these are safe to cache aggressively — a new build always gets new
    # filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}